<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>x64 Windows Calling Convention</title>
<style>
  body {
    font-family: sans-serif;
    background: #fff;
    color: #111;
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a18; color: #e0ded4; }
  }

  h2 { font-size: 18px; font-weight: 500; margin: 0 0 16px; }
  p.note { font-size: 13px; color: #666; margin: 12px 0 0; }
  @media (prefers-color-scheme: dark) { p.note { color: #999; } }

  /* Color ramps */
  .c-gray rect, .c-gray circle, .c-gray ellipse { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-blue rect, .c-blue circle, .c-blue ellipse { fill: #E6F1FB; stroke: #185FA5; }
  .c-teal rect, .c-teal circle, .c-teal ellipse { fill: #E1F5EE; stroke: #0F6E56; }
  .c-amber rect, .c-amber circle, .c-amber ellipse { fill: #FAEEDA; stroke: #854F0B; }
  .c-coral rect, .c-coral circle, .c-coral ellipse { fill: #FAECE7; stroke: #993C1D; }

  .c-gray text  { fill: #444441; }
  .c-blue text  { fill: #0C447C; }
  .c-teal text  { fill: #085041; }
  .c-amber text { fill: #633806; }
  .c-coral text { fill: #712B13; }

  @media (prefers-color-scheme: dark) {
    .c-gray rect, .c-gray circle, .c-gray ellipse   { fill: #444441; stroke: #D3D1C7; }
    .c-blue rect, .c-blue circle, .c-blue ellipse   { fill: #0C447C; stroke: #B5D4F4; }
    .c-teal rect, .c-teal circle, .c-teal ellipse   { fill: #085041; stroke: #9FE1CB; }
    .c-amber rect, .c-amber circle, .c-amber ellipse{ fill: #633806; stroke: #FAC775; }
    .c-coral rect, .c-coral circle, .c-coral ellipse{ fill: #712B13; stroke: #F5C4B3; }

    .c-gray text  { fill: #D3D1C7; }
    .c-blue text  { fill: #B5D4F4; }
    .c-teal text  { fill: #9FE1CB; }
    .c-amber text { fill: #FAC775; }
    .c-coral text { fill: #F5C4B3; }
  }

  .t  { font-size: 14px; font-weight: 400; font-family: sans-serif; }
  .th { font-size: 14px; font-weight: 500; font-family: sans-serif; }
  .ts { font-size: 12px; font-weight: 400; font-family: sans-serif; }

  /* dashed note box */
  .note-rect { fill: none; stroke: #ccc; stroke-width: 0.5; stroke-dasharray: 4 3; }
  @media (prefers-color-scheme: dark) { .note-rect { stroke: #555; } }
  .note-text { font-size: 12px; font-family: sans-serif; fill: #555; }
  @media (prefers-color-scheme: dark) { .note-text { fill: #aaa; } }
</style>
</head>
<body>
<h2>x64 Windows Calling Convention — Parameter Passing</h2>
<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Column headers -->
<g class="c-gray">
  <rect x="20" y="20" width="60" height="36" rx="6" stroke-width="0.5"/>
  <text class="th" x="50" y="38" text-anchor="middle" dominant-baseline="central">Slot</text>
</g>
<g class="c-blue">
  <rect x="90" y="20" width="150" height="36" rx="6" stroke-width="0.5"/>
  <text class="th" x="165" y="38" text-anchor="middle" dominant-baseline="central">Integer / pointer</text>
</g>
<g class="c-teal">
  <rect x="250" y="20" width="150" height="36" rx="6" stroke-width="0.5"/>
  <text class="th" x="325" y="38" text-anchor="middle" dominant-baseline="central">Float / double</text>
</g>
<g class="c-amber">
  <rect x="410" y="20" width="250" height="36" rx="6" stroke-width="0.5"/>
  <text class="th" x="535" y="38" text-anchor="middle" dominant-baseline="central">Variadic (both slots used)</text>
</g>

<!-- Row 1 -->
<g class="c-gray">
  <rect x="20" y="66" width="60" height="52" rx="6" stroke-width="0.5"/>
  <text class="th" x="50" y="92" text-anchor="middle" dominant-baseline="central">1st</text>
</g>
<g class="c-blue">
  <rect x="90" y="66" width="150" height="52" rx="6" stroke-width="0.5"/>
  <text class="th" x="165" y="84" text-anchor="middle" dominant-baseline="central">RCX</text>
  <text class="ts" x="165" y="104" text-anchor="middle" dominant-baseline="central">integer / pointer</text>
</g>
<g class="c-teal">
  <rect x="250" y="66" width="150" height="52" rx="6" stroke-width="0.5"/>
  <text class="th" x="325" y="84" text-anchor="middle" dominant-baseline="central">XMM0</text>
  <text class="ts" x="325" y="104" text-anchor="middle" dominant-baseline="central">float / double</text>
</g>
<g class="c-amber">
  <rect x="410" y="66" width="250" height="52" rx="6" stroke-width="0.5"/>
  <text class="th" x="535" y="84" text-anchor="middle" dominant-baseline="central">XMM0  +  RCX</text>
  <text class="ts" x="535" y="104" text-anchor="middle" dominant-baseline="central">both registers loaded</text>
</g>

<!-- Row 2 -->
<g class="c-gray">
  <rect x="20" y="128" width="60" height="52" rx="6" stroke-width="0.5"/>
  <text class="th" x="50" y="154" text-anchor="middle" dominant-baseline="central">2nd</text>
</g>
<g class="c-blue">
  <rect x="90" y="128" width="150" height="52" rx="6" stroke-width="0.5"/>
  <text class="th" x="165" y="146" text-anchor="middle" dominant-baseline="central">RDX</text>
  <text class="ts" x="165" y="166" text-anchor="middle" dominant-baseline="central">integer / pointer</text>
</g>
<g class="c-teal">
  <rect x="250" y="128" width="150" height="52" rx="6" stroke-width="0.5"/>
  <text class="th" x="325" y="146" text-anchor="middle" dominant-baseline="central">XMM1</text>
  <text class="ts" x="325" y="166" text-anchor="middle" dominant-baseline="central">float / double</text>
</g>
<g class="c-amber">
  <rect x="410" y="128" width="250" height="52" rx="6" stroke-width="0.5"/>
  <text class="th" x="535" y="146" text-anchor="middle" dominant-baseline="central">XMM1  +  RDX</text>
  <text class="ts" x="535" y="166" text-anchor="middle" dominant-baseline="central">both registers loaded</text>
</g>

<!-- Row 3 -->
<g class="c-gray">
  <rect x="20" y="190" width="60" height="52" rx="6" stroke-width="0.5"/>
  <text class="th" x="50" y="216" text-anchor="middle" dominant-baseline="central">3rd</text>
</g>
<g class="c-blue">
  <rect x="90" y="190" width="150" height="52" rx="6" stroke-width="0.5"/>
  <text class="th" x="165" y="208" text-anchor="middle" dominant-baseline="central">R8</text>
  <text class="ts" x="165" y="228" text-anchor="middle" dominant-baseline="central">integer / pointer</text>
</g>
<g class="c-teal">
  <rect x="250" y="190" width="150" height="52" rx="6" stroke-width="0.5"/>
  <text class="th" x="325" y="208" text-anchor="middle" dominant-baseline="central">XMM2</text>
  <text class="ts" x="325" y="228" text-anchor="middle" dominant-baseline="central">float / double</text>
</g>
<g class="c-amber">
  <rect x="410" y="190" width="250" height="52" rx="6" stroke-width="0.5"/>
  <text class="th" x="535" y="208" text-anchor="middle" dominant-baseline="central">XMM2  +  R8</text>
  <text class="ts" x="535" y="228" text-anchor="middle" dominant-baseline="central">both registers loaded</text>
</g>

<!-- Row 4 -->
<g class="c-gray">
  <rect x="20" y="252" width="60" height="52" rx="6" stroke-width="0.5"/>
  <text class="th" x="50" y="278" text-anchor="middle" dominant-baseline="central">4th</text>
</g>
<g class="c-blue">
  <rect x="90" y="252" width="150" height="52" rx="6" stroke-width="0.5"/>
  <text class="th" x="165" y="270" text-anchor="middle" dominant-baseline="central">R9</text>
  <text class="ts" x="165" y="290" text-anchor="middle" dominant-baseline="central">integer / pointer</text>
</g>
<g class="c-teal">
  <rect x="250" y="252" width="150" height="52" rx="6" stroke-width="0.5"/>
  <text class="th" x="325" y="270" text-anchor="middle" dominant-baseline="central">XMM3</text>
  <text class="ts" x="325" y="290" text-anchor="middle" dominant-baseline="central">float / double</text>
</g>
<g class="c-amber">
  <rect x="410" y="252" width="250" height="52" rx="6" stroke-width="0.5"/>
  <text class="th" x="535" y="270" text-anchor="middle" dominant-baseline="central">XMM3  +  R9</text>
  <text class="ts" x="535" y="290" text-anchor="middle" dominant-baseline="central">both registers loaded</text>
</g>

<!-- Row 5th+ spans all three type columns -->
<g class="c-gray">
  <rect x="20" y="314" width="60" height="72" rx="6" stroke-width="0.5"/>
  <text class="th" x="50" y="342" text-anchor="middle" dominant-baseline="central">5th+</text>
  <text class="ts" x="50" y="362" text-anchor="middle" dominant-baseline="central">(all)</text>
</g>
<g class="c-coral">
  <rect x="90" y="314" width="570" height="72" rx="6" stroke-width="0.5"/>
  <text class="th" x="375" y="338" text-anchor="middle" dominant-baseline="central">Stack</text>
  <text class="ts" x="375" y="358" text-anchor="middle" dominant-baseline="central">right-to-left, above the 32-byte shadow space</text>
  <text class="ts" x="375" y="376" text-anchor="middle" dominant-baseline="central">callee must NOT write below RSP before saving</text>
</g>

<!-- Shadow space note -->
<rect class="note-rect" x="20" y="400" width="640" height="40" rx="6"/>
<text class="note-text" x="40" y="421" dominant-baseline="central">Shadow space: caller always reserves 32 bytes above the return address, even if fewer than 4 args are passed.</text>

</svg>
<p class="note">Verified against Microsoft Learn — x64 calling convention (MSVC). All claims confirmed accurate.</p>
</body>
</html>
